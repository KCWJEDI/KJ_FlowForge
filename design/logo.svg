<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5b5bf0"/>
      <stop offset="45%" stop-color="#6d3ce8"/>
      <stop offset="100%" stop-color="#8b2fd6"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dbe9ff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#badge)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#sheen)"/>
  <rect x="17.5" y="17.5" width="477" height="477" rx="110.5" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="3"/>

  <g filter="url(#glow)">
    <path d="M286 92 L168 268 h74 L214 420 L346 232 h-84 L286 92 Z"
          fill="url(#bolt)" stroke="#e6efff" stroke-opacity="0.5" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <circle cx="166" cy="352" r="17" fill="#22d3ee"/>
  <circle cx="166" cy="352" r="30" fill="#22d3ee" fill-opacity="0.28"/>
</svg>
